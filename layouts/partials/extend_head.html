{{ if or .Params.math .Site.Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css"
    integrity="sha384-wcIxkf4k558AjM3Yz3BBFQUbk/zgIYC2R0QpeeYb+TwlBVMrlgLqwRjRtGZiK7ww" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"
    integrity="sha384-hIoBPJpTUs74ddyc4bFZSM1TVlQDA60VBbJS0oA934VSz82sBx1X7kSx2ATBDIyd" crossorigin="anonymous">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"
    integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous" onload="renderMathInElement(document.body,
              {
                  delimiters: [
                      {left: '$$', right: '$$', display: true},
                      {left: '\\[', right: '\\]', display: true},
                      {left: '$', right: '$', display: false},
                      {left: '\\(', right: '\\)', display: false}
                  ]
              }
    );"></script>
{{ end }}

<!-- Media Overlay Styles -->
<style>
.media-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s ease, visibility 0.2s ease;
  cursor: zoom-out;
}

.media-overlay.active {
  opacity: 1;
  visibility: visible;
}

.media-overlay__content {
  max-width: 95vw;
  max-height: 95vh;
  position: relative;
}

.media-overlay img {
  max-width: 95vw;
  max-height: 95vh;
  object-fit: contain;
  display: block;
}

.media-overlay video {
  max-width: 95vw;
  max-height: 95vh;
  object-fit: contain;
  display: block;
}

.media-overlay__carousel {
  display: flex;
  align-items: center;
  gap: 20px;
}

.media-overlay__carousel-wrapper {
  position: relative;
}

.media-overlay__carousel-container {
  display: flex;
  overflow: hidden;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  max-width: 85vw;
  max-height: 85vh;
}

.media-overlay__carousel-item {
  flex: 0 0 100%;
  scroll-snap-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
}

.media-overlay__carousel-item img,
.media-overlay__carousel-item video {
  max-width: 100%;
  max-height: 85vh;
  object-fit: contain;
}

.media-overlay__nav {
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: white;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 24px;
  cursor: pointer;
  transition: background 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.media-overlay__nav:hover {
  background: rgba(255, 255, 255, 0.2);
}

.media-overlay__dots {
  position: absolute;
  bottom: -40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
}

.media-overlay__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.4);
  border: none;
  cursor: pointer;
  transition: background 0.2s ease;
}

.media-overlay__dot.active {
  background: white;
}

.media-overlay__close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 24px;
  cursor: pointer;
  transition: background 0.2s ease;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.media-overlay__close:hover {
  background: rgba(255, 255, 255, 0.2);
}

.post-content img,
.post-content video,
[data-zoomable="true"] {
  cursor: zoom-in;
}
</style>
